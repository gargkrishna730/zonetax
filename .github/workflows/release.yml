name: Release

# Push a tag like v0.1.0 to publish:
#   - CLI binaries (linux/darwin, amd64/arm64) on the GitHub Release
#   - the Helm chart package on the GitHub Release
#   - the Helm repo index on the gh-pages branch (https://gargkrishna730.github.io/zonetax)
# Container images for the same tag are built by build-push.yml (tag 0.1.0, no "v").
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.0

      - name: Build CLI binaries
        run: |
          mkdir -p dist
          for os in linux darwin; do
            for arch in amd64 arm64; do
              name="zonetax_${TAG#v}_${os}_${arch}"
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
                -ldflags "-s -w -X main.version=${TAG}" -o "dist/$name/zonetax" ./cmd/zonetax
              tar -C "dist/$name" -czf "dist/$name.tar.gz" zonetax
            done
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)

      - name: Package Helm chart (version = tag)
        run: |
          helm lint deploy/helm/zonetax
          helm package deploy/helm/zonetax --version "${TAG#v}" --app-version "${TAG#v}" -d dist

      # Re-render install.yaml at the release tag. The committed copy is generated from
      # Chart.yaml's appVersion, which is a placeholder, so shipping it as-is pinned the
      # released manifests to stale image tags. Render with the tag so `kubectl apply -f
      # install.yaml` pulls the images that belong to this release.
      - name: Render install.yaml at the release version
        run: |
          mkdir -p dist
          {
            echo "# ZoneTax raw Kubernetes manifests for ${TAG}."
            echo "# GENERATED during release from deploy/helm/zonetax. Do not edit by hand."
            echo "# Install: kubectl apply -f install.yaml"
            echo "---"
            echo "apiVersion: v1"
            echo "kind: Namespace"
            echo "metadata:"
            echo "  name: zonetax"
            helm template zonetax deploy/helm/zonetax \
              --namespace zonetax \
              --set agent.image.tag="${TAG#v}" \
              --set collector.image.tag="${TAG#v}"
          } > dist/install.yaml
          # Fail the release rather than publish manifests pointing at the wrong images.
          if ! grep -q "zonetax-collector:${TAG#v}" dist/install.yaml; then
            echo "install.yaml does not reference the collector image for ${TAG#v}" >&2
            exit 1
          fi
          if ! grep -q "zonetax-agent:${TAG#v}" dist/install.yaml; then
            echo "install.yaml does not reference the agent image for ${TAG#v}" >&2
            exit 1
          fi
          grep -oE 'ghcr.io/gargkrishna730/zonetax-[a-z]+:[^"]+' dist/install.yaml | sort -u

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes --title "$TAG"
          gh release upload "$TAG" --clobber dist/*.tar.gz dist/*.tgz dist/checksums.txt dist/install.yaml

      - name: Update Helm repo index on gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch origin gh-pages
            git worktree add pages origin/gh-pages
          else
            git worktree add --detach pages
            git -C pages checkout --orphan gh-pages
            git -C pages rm -rfq .
          fi
          mkdir -p idx && cp dist/*.tgz idx/
          if [ -f pages/index.yaml ]; then
            helm repo index idx --url "$url" --merge pages/index.yaml
          else
            helm repo index idx --url "$url"
          fi
          cp idx/index.yaml pages/index.yaml
          cat > pages/index.html <<HTML
          <!doctype html><title>ZoneTax Helm repo</title>
          <h1>ZoneTax Helm repository</h1>
          <pre>helm repo add zonetax https://${GITHUB_REPOSITORY_OWNER}.github.io/zonetax
          helm install zonetax zonetax/zonetax -n zonetax --create-namespace</pre>
          <p><a href="https://github.com/${GITHUB_REPOSITORY}">github.com/${GITHUB_REPOSITORY}</a></p>
          HTML
          cd pages
          git add index.yaml index.html
          git commit -m "Publish chart ${TAG}"
          git push origin HEAD:gh-pages
