apiVersion: v2
name: zonetax
description: Real-time cross-AZ Kubernetes network cost visibility (AWS/EKS)
type: application
# Kept in sync with the latest released tag. The release workflow overrides both with the tag
# being published (`helm package --version --app-version`), so these values matter only for
# installs straight from a clone: appVersion is the default image tag, so a stale value here
# silently pulls old images. Bump both when cutting a release.
version: 0.7.1
appVersion: "0.7.1"
home: https://github.com/gargkrishna730/zonetax
sources:
  - https://github.com/gargkrishna730/zonetax
keywords:
  - kubernetes
  - finops
  - cost
  - networking
  - aws
  - eks
maintainers:
  - name: Krishna Garg
    url: https://github.com/gargkrishna730
# Artifact Hub reads these to render the listing. Without them the chart shows up as an
# unverified entry with no links, which is most of the reason to be listed at all.
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: monitoring-logging
  artifacthub.io/links: |
    - name: source
      url: https://github.com/gargkrishna730/zonetax
    - name: How it was built
      url: https://github.com/gargkrishna730/zonetax/blob/main/docs/blog/building-zonetax.md
    - name: Accuracy methodology
      url: https://github.com/gargkrishna730/zonetax/blob/main/docs/accuracy.md
  artifacthub.io/crds: "[]"
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/prerelease: "false"
