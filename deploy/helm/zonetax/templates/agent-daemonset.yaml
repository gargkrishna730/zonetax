apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "zonetax.fullname" . }}-agent
  labels:
    {{- include "zonetax.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      {{- include "zonetax.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        {{- include "zonetax.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: agent
    spec:
      serviceAccountName: {{ include "zonetax.serviceAccountName" . }}
      hostNetwork: true
      containers:
        - name: agent
          image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}"
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: SAMPLE_INTERVAL_SECONDS
              value: {{ .Values.agent.sampleIntervalSeconds | quote }}
          ports:
            - containerPort: 9090
              name: metrics
          volumeMounts:
            - name: host-proc
              mountPath: /proc
              readOnly: true
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
      volumes:
        - name: host-proc
          hostPath:
            path: /proc
