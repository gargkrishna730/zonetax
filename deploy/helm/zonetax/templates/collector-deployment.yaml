apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zonetax.fullname" . }}-collector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zonetax.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
spec:
  replicas: {{ .Values.collector.replicas }}
  {{- if .Values.collector.persistence.enabled }}
  # A ReadWriteOnce EBS volume can only attach to one pod: stop the old pod before starting
  # the new one. Done with maxSurge 0 rather than type: Recreate, because switching an existing
  # Deployment's strategy type is rejected on upgrade (leftover rollingUpdate fields).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "zonetax.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: collector
  template:
    metadata:
      labels:
        {{- include "zonetax.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: collector
    spec:
      serviceAccountName: {{ include "zonetax.serviceAccountName" . }}
      # Graceful shutdown writes a final history save.
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 65532
      containers:
        - name: collector
          image: "{{ .Values.collector.image.repository }}:{{ .Values.collector.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.collector.image.pullPolicy }}
          env:
            # Let the Go GC track the container memory limit instead of growing until OOM.
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
                  divisor: "1"
            - name: HISTORY_FILE
              value: /data/history.json.gz
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            {{- toYaml .Values.collector.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.collector.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.collector.persistence.existingClaim | default (printf "%s-collector-data" (include "zonetax.fullname" .)) }}
          {{- else }}
          emptyDir:
            sizeLimit: 64Mi
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "zonetax.fullname" . }}-collector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zonetax.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
spec:
  type: {{ .Values.collector.service.type }}
  ports:
    - port: {{ .Values.collector.service.port }}
      targetPort: http
      name: http
  selector:
    {{- include "zonetax.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: collector
