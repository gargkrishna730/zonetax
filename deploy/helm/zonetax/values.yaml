# Which cloud and region to price cross-AZ traffic against.
#
# Both are auto-detected from the cluster's node labels (topology.kubernetes.io/region) and
# spec.providerID, so you normally do not need to set either. Set them only to override
# detection, e.g. on a cluster whose nodes are not labelled.
#
# Leaving region empty is safe: the cloud-level default rate is used and the dashboard reports
# the region as "unknown" rather than claiming a region the cluster isn't in.
cloud:
  # "aws" or "gcp". Note: Azure does not charge for cross-AZ data transfer (removed May 2024),
  # so there is no cross-AZ cost for ZoneTax to report there.
  provider: ""
  # e.g. "us-west-2". Empty means auto-detect.
  region: ""

agent:
  image:
    repository: ghcr.io/gargkrishna730/zonetax-agent
    # Defaults to the chart's appVersion (the release tag). Set e.g. "latest" to track main.
    tag: ""
    pullPolicy: IfNotPresent
  sampleIntervalSeconds: 15
  # Enables byte-count accounting in the kernel's conntrack table via a privileged init
  # container that sets net.netfilter.nf_conntrack_acct=1 on the node. Required for non-zero
  # cross-AZ byte metrics — most default node images (e.g. EKS AL2023) ship with this disabled.
  # Disable if your nodes already have this sysctl set via a different mechanism (e.g. node
  # bootstrap config), or if the privileged init container isn't acceptable in your environment.
  enableConntrackAcct: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  # The agent must run on every node or that node's traffic is not measured. On a node with no
  # free memory the pod stays Pending forever. Set a priority class so the scheduler can make
  # room, e.g. "system-node-critical" (built in) or your own class.
  priorityClassName: ""
  # maxUnavailable > 1 (or a percentage) keeps rollouts moving when one node can't schedule.
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%

collector:
  image:
    repository: ghcr.io/gargkrishna730/zonetax-collector
    # Defaults to the chart's appVersion (the release tag). Set e.g. "latest" to track main.
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1
  # How often the collector scrapes every agent. This is the data-freshness bound reported as
  # scrape_interval_seconds in the API. Raising it reduces load on large clusters; lowering it
  # makes the dashboard more responsive. The agent's own sampling cadence is agent.sampleIntervalSeconds.
  scrapeIntervalSeconds: 30
  # Per-agent scrape timeout. Must stay well under scrapeIntervalSeconds. A timeout counts as a
  # failed scrape and shows up in the API's coverage block, never as zero traffic.
  scrapeTimeoutSeconds: 5
  # Cost history is saved to /data every 5 minutes and on shutdown, and reloaded on start.
  # Default (persistence.enabled=false): an emptyDir, which survives container crashes and
  # OOM restarts but not pod replacement (rollouts, node moves).
  # persistence.enabled=true: a small PVC (e.g. EBS gp3, ~$0.08/month for 1Gi) that survives
  # everything. Note EBS volumes are zonal, so the collector stays in the volume's AZ.
  persistence:
    enabled: false
    size: 1Gi
    storageClass: ""     # empty = cluster default
    existingClaim: ""    # use a pre-created PVC instead
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

serviceAccount:
  create: true
  name: ""
