agent:
  image:
    repository: ghcr.io/gargkrishna730/zonetax-agent
    tag: "latest"
    pullPolicy: Always
  sampleIntervalSeconds: 15
  # Enables byte-count accounting in the kernel's conntrack table via a privileged init
  # container that sets net.netfilter.nf_conntrack_acct=1 on the node. Required for non-zero
  # cross-AZ byte metrics — most default node images (e.g. EKS AL2023) ship with this disabled.
  # Disable if your nodes already have this sysctl set via a different mechanism (e.g. node
  # bootstrap config), or if the privileged init container isn't acceptable in your environment.
  enableConntrackAcct: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

collector:
  image:
    repository: ghcr.io/gargkrishna730/zonetax-collector
    tag: "latest"
    pullPolicy: Always
  replicas: 1
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

serviceAccount:
  create: true
  name: ""

alerting:
  slackWebhookUrl: ""
  thresholdUsdPerHour: 5
