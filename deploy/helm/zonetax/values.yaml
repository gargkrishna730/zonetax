agent:
  image:
    repository: ghcr.io/gargkrishna730/zonetax-agent
    # Defaults to the chart's appVersion (the release tag). Set e.g. "latest" to track main.
    tag: ""
    pullPolicy: IfNotPresent
  sampleIntervalSeconds: 15
  # Enables byte-count accounting in the kernel's conntrack table via a privileged init
  # container that sets net.netfilter.nf_conntrack_acct=1 on the node. Required for non-zero
  # cross-AZ byte metrics — most default node images (e.g. EKS AL2023) ship with this disabled.
  # Disable if your nodes already have this sysctl set via a different mechanism (e.g. node
  # bootstrap config), or if the privileged init container isn't acceptable in your environment.
  enableConntrackAcct: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

collector:
  image:
    repository: ghcr.io/gargkrishna730/zonetax-collector
    # Defaults to the chart's appVersion (the release tag). Set e.g. "latest" to track main.
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1
  # Cost history is saved to /data every 5 minutes and on shutdown, and reloaded on start.
  # Default (persistence.enabled=false): an emptyDir, which survives container crashes and
  # OOM restarts but not pod replacement (rollouts, node moves).
  # persistence.enabled=true: a small PVC (e.g. EBS gp3, ~$0.08/month for 1Gi) that survives
  # everything. Note EBS volumes are zonal, so the collector stays in the volume's AZ.
  persistence:
    enabled: false
    size: 1Gi
    storageClass: ""     # empty = cluster default
    existingClaim: ""    # use a pre-created PVC instead
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

serviceAccount:
  create: true
  name: ""

alerting:
  slackWebhookUrl: ""
  thresholdUsdPerHour: 5
